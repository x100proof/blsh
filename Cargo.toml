[package]
name = "blsh"
version = "0.1.0"
edition = "2021"

[dependencies]
blst = "0.3.14"
pest = "2.8.0"
pest_derive = "2.8.0"
rustyline = "16.0.0"
hex = "0.4.3"
num-bigint = "0.4.6"
num-traits = "0.2.19"
dirs = "6.0.0"
pretty = { git = "https://github.com/one-hundred-proof/pretty.rs", rev = "7e3bf6f374b256812c5afdbbaebf9442f31e123c"}
ansi_term = "0.12.1"
atty = "0.2.14"
terminal_size = "0.4.2"

[build-dependencies]
pest_generator = "2.8.0"

[profile.release]
opt-level = "z"  # Or "s" if you prefer balance over size
lto = true